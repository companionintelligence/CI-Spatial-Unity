version: "3.9"
services:
  cv-server:
    build: .
    ports:
      - "8000:8000"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CV_SERVER_DEVICE=cuda
      - GDINO_CONFIG_PATH=/app/configs/GroundingDINO_SwinT_OGC.py
      - GDINO_WEIGHTS_PATH=/app/checkpoints/groundingdino_swint_ogc.pth
      - SAM2_CONFIG_PATH=/app/configs/sam2.1_hiera_t.yaml
      - SAM2_WEIGHTS_PATH=/app/checkpoints/sam2.1_hiera_tiny.pt
      - FLORENCE_MODEL_ID=microsoft/Florence-2-large
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    restart: unless-stopped

volumes:
  huggingface_cache:
