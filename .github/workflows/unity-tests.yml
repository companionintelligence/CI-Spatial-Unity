name: Unity Tests

# >>> ci-local:gated original triggers below, restore with `ci-local restore`
# on:
#   push:
#     branches: [ main ]
#   pull_request:
#     branches: [ main ]
#   schedule:
#     - cron: "0 4 * * *"
# <<< ci-local:gated
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: EditMode and PlayMode (unit)
    runs-on: [self-hosted, windows, x64, gpu]
    outputs:
      unity-version: ${{ steps.unity.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read Unity version from ProjectVersion.txt
        id: unity
        shell: pwsh
        run: |
          $match = Select-String -Path ProjectSettings/ProjectVersion.txt -Pattern '^m_EditorVersion:\s*(\S+)' | Select-Object -First 1
          if (-not $match) { throw 'm_EditorVersion not found in ProjectSettings/ProjectVersion.txt' }
          $version = $match.Matches[0].Groups[1].Value
          Write-Host "Unity editor version: $version"
          if (-not (Select-String -Path README.md -Pattern $version -SimpleMatch -Quiet)) {
            Write-Host "::warning file=README.md::README.md does not mention Unity $version from ProjectSettings/ProjectVersion.txt"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Unity Test Runner
        uses: game-ci/unity-test-runner@fa6ced25861c16ef56187828c43f76d00df43a23 # v4.3.2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          CompanionScan_TEST_ARTIFACTS: ${{ github.workspace }}/artifacts
        with:
          unityVersion: ${{ steps.unity.outputs.version }}
          projectPath: .
          testMode: all
          artifactsPath: artifacts

      - name: Upload Test Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 7
          name: unity-test-artifacts
          path: artifacts
          if-no-files-found: warn

  integration-tests:
    name: CV Server Integration
    runs-on: [self-hosted, windows, x64, gpu]
    needs: unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Wait for cv-server health
        shell: pwsh
        run: |
          $healthUrl = "http://localhost:8000/v1/health"
          for ($i = 0; $i -lt 30; $i++) {
            try {
              $resp = Invoke-WebRequest -Uri $healthUrl -UseBasicParsing -TimeoutSec 5
              if ($resp.StatusCode -eq 200) { exit 0 }
            } catch {}
            Start-Sleep -Seconds 10
          }
          throw "cv-server did not become healthy at $healthUrl"

      - name: Unity Test Runner (integration)
        uses: game-ci/unity-test-runner@fa6ced25861c16ef56187828c43f76d00df43a23 # v4.3.2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          CompanionScan_TEST_SERVER_URL: http://localhost:8000
          CompanionScan_TEST_ARTIFACTS: ${{ github.workspace }}/artifacts
        with:
          unityVersion: ${{ needs.unit-tests.outputs.unity-version }}
          projectPath: .
          testMode: playmode
          artifactsPath: artifacts

      - name: Upload Test Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 7
          name: unity-test-artifacts-integration
          path: artifacts
          if-no-files-found: warn
