name: Unity Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 4 * * *"

jobs:
  deterministic-tests:
    name: Deterministic EditMode + PlayMode
    runs-on: [self-hosted, windows, x64, gpu]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unity Test Runner (deterministic gate)
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          CompanionScan_TEST_DETERMINISTIC_ONLY: "true"
          CompanionScan_TEST_ENABLE_LIVE_INTEGRATION: "false"
          CompanionScan_TEST_AUTO_UPDATE_SNAPSHOTS: "false"
          CompanionScan_TEST_ARTIFACTS: ${{ github.workspace }}/artifacts
        with:
          unityVersion: 6000.3.9f1
          projectPath: .
          testMode: all
          artifactsPath: artifacts

      - name: Upload Deterministic Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unity-test-artifacts-deterministic
          path: artifacts
          if-no-files-found: warn

  integration-tests:
    name: Live CV + XR Integration
    runs-on: [self-hosted, windows, x64, gpu]
    needs: deterministic-tests
    if: github.ref == 'refs/heads/main' || github.event_name == 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for cv-server health
        shell: pwsh
        run: |
          $healthUrl = "http://localhost:8000/v1/health"
          for ($i = 0; $i -lt 30; $i++) {
            try {
              $resp = Invoke-WebRequest -Uri $healthUrl -UseBasicParsing -TimeoutSec 5
              if ($resp.StatusCode -eq 200) { exit 0 }
            } catch {}
            Start-Sleep -Seconds 10
          }
          throw "cv-server did not become healthy at $healthUrl"

      - name: Unity Test Runner (live integration)
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          CompanionScan_TEST_SERVER_URL: http://localhost:8000
          CompanionScan_TEST_DETERMINISTIC_ONLY: "false"
          CompanionScan_TEST_ENABLE_LIVE_INTEGRATION: "true"
          CompanionScan_TEST_AUTO_UPDATE_SNAPSHOTS: "false"
          CompanionScan_TEST_ARTIFACTS: ${{ github.workspace }}/artifacts
        with:
          unityVersion: 6000.3.9f1
          projectPath: .
          testMode: playmode
          artifactsPath: artifacts

      - name: Upload Integration Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unity-test-artifacts-integration
          path: artifacts
          if-no-files-found: warn

  visual-diagnostics:
    name: Visual Diagnostics (Auto Baseline)
    runs-on: [self-hosted, windows, x64, gpu]
    needs: deterministic-tests
    if: github.ref == 'refs/heads/main' || github.event_name == 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unity Test Runner (visual diagnostics)
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          CompanionScan_TEST_DETERMINISTIC_ONLY: "false"
          CompanionScan_TEST_ENABLE_LIVE_INTEGRATION: "true"
          CompanionScan_TEST_AUTO_UPDATE_SNAPSHOTS: "true"
          CompanionScan_TEST_ARTIFACTS: ${{ github.workspace }}/artifacts
        with:
          unityVersion: 6000.3.9f1
          projectPath: .
          testMode: playmode
          customParameters: -testFilter CompanionScan.Tests.PlayMode.MaskOverlayScreenshotTests,CompanionScan.Tests.PlayMode.XrSceneScreenshotTests
          artifactsPath: artifacts

      - name: Upload Visual Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unity-test-artifacts-visual
          path: artifacts
          if-no-files-found: warn