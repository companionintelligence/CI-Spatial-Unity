name: cv-server publish

# Builds cv-server/ and pushes it to GitHub Container Registry as
#   ghcr.io/<owner>/ci-xr-scan-cv-server:<number>
# then prints the digest so CI-Marketplace can pin <image>:<number>@<digest>.
# Manual only, from the default branch:
#   gh workflow run cv-server-publish.yml            # tag = this workflow's run number
#   gh workflow run cv-server-publish.yml -f tag=12  # explicit numeric tag
# Authenticates with the workflow's GITHUB_TOKEN only; no other secrets.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Numeric image tag (digits only). Leave empty to use the run number.
        required: false
        default: ""
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: cv-server-publish
  cancel-in-progress: false

env:
  IMAGE_NAME: ci-xr-scan-cv-server

jobs:
  publish:
    name: Build and push to GHCR
    # Pinned rather than ubuntu-latest: the disk clean-up below relies on this image's layout.
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    outputs:
      image: ${{ steps.ref.outputs.image }}
      tag: ${{ steps.ref.outputs.tag }}
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - name: Resolve image reference
        id: ref
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RUN_NUMBER: ${{ github.run_number }}
          OWNER: ${{ github.repository_owner }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::Publish from $DEFAULT_BRANCH only; this run is on $GITHUB_REF."
            exit 1
          fi
          tag="${INPUT_TAG:-$RUN_NUMBER}"
          if [[ ! "$tag" =~ ^[0-9]+$ ]]; then
            echo "::error::The image tag must be digits only, got '$tag'."
            exit 1
          fi
          image="ghcr.io/${OWNER,,}/${IMAGE_NAME}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Publishing $image:$tag"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space for the CUDA image
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune --all --force > /dev/null
          df -h /

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin

      - name: Refuse to overwrite an existing tag
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
          TAG: ${{ steps.ref.outputs.tag }}
        run: |
          if docker buildx imagetools inspect "$IMAGE:$TAG" > /dev/null 2>&1; then
            echo "::error::$IMAGE:$TAG already exists. Published tags are immutable; run again with a new tag."
            exit 1
          fi

      - name: Build image
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
          TAG: ${{ steps.ref.outputs.tag }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          docker build cv-server \
            --progress plain \
            --tag "$IMAGE:$TAG" \
            --label "org.opencontainers.image.title=cv-server" \
            --label "org.opencontainers.image.source=$SOURCE_URL" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$TAG"

      - name: Push image
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
          TAG: ${{ steps.ref.outputs.tag }}
        run: docker push "$IMAGE:$TAG"

      - name: Print digest
        id: digest
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
          TAG: ${{ steps.ref.outputs.tag }}
        run: |
          set -euo pipefail
          # Ask the registry, so the digest is exactly what `docker pull` resolves.
          digest="$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest}}' | jq -r .digest)"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Could not read the digest of $IMAGE:$TAG (got '$digest')."
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Image:  $IMAGE:$TAG"
          echo "Digest: $digest"
          echo "Pin:    $IMAGE:$TAG@$digest"
          echo "::notice title=cv-server image::$IMAGE:$TAG@$digest"
          {
            echo "### cv-server image"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Tag | \`$IMAGE:$TAG\` |"
            echo "| Digest | \`$digest\` |"
            echo "| Pin (CI-Marketplace) | \`$IMAGE:$TAG@$digest\` |"
            echo "| Commit | \`$GITHUB_SHA\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
