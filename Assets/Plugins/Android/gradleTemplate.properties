org.gradle.jvmargs=-Xmx**JVM_HEAP_SIZE**M
org.gradle.parallel=true
unityStreamingAssets=**STREAMING_ASSETS**
**ADDITIONAL_PROPERTIES**
# Meta XR SDK 85 ships OVRPlugin.aar, InteractionSdk.aar and SDKTelemetry.aar, which all declare
# namespace com.oculus.Integration. AGP 9 (Unity 6000.3) rejects duplicate namespaces by default and
# fails :launcher:processReleaseMainManifest. Keep the AGP 8 behaviour (warning only) until Meta ships
# unique namespaces for these libraries, then delete this line and this template.
android.uniquePackageNames=false
